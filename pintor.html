<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintor de Craques</title>
    <meta name="theme-color" content="#11998e">
    <meta name="description" content="Monte e pinte o seu jogador de futebol!">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        /* === FLOATING BG === */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            pointer-events: none;
            z-index: 0;
        }
        .bg-circle:nth-child(1) { width: 200px; height: 200px; top: -50px; left: -50px; animation: float 8s ease-in-out infinite; }
        .bg-circle:nth-child(2) { width: 150px; height: 150px; bottom: -30px; right: -30px; animation: float 10s ease-in-out infinite reverse; }
        .bg-circle:nth-child(3) { width: 100px; height: 100px; top: 40%; left: 80%; animation: float 7s ease-in-out infinite; }
        .bg-circle:nth-child(4) { width: 180px; height: 180px; top: 60%; left: -40px; animation: float 9s ease-in-out infinite reverse; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            animation: fadeIn 0.5s ease;
        }
        .screen.active { display: flex; }

        .top-bar {
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .home-link {
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            background: rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
        }

        h1.title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.6rem;
            text-align: center;
            margin: 30px 0 6px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.25);
        }
        .subtitle {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 600;
            opacity: 0.95;
            margin-bottom: 26px;
        }

        .mascot {
            font-size: 6rem;
            margin: 10px 0 4px;
            animation: bob 2.2s ease-in-out infinite;
        }
        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

        .btn {
            font-family: 'Fredoka One', cursive;
            border: none;
            border-radius: 18px;
            padding: 16px 34px;
            font-size: 1.3rem;
            cursor: pointer;
            color: #11998e;
            background: #fff;
            box-shadow: 0 10px 24px rgba(0,0,0,0.25);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(0) scale(0.97); }
        .btn.secondary {
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.05rem;
            padding: 12px 22px;
        }

        /* === STEP HEADER === */
        .step-head {
            font-family: 'Fredoka One', cursive;
            font-size: 1.9rem;
            text-align: center;
            margin: 4px 0 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .step-sub { text-align:center; font-weight:600; opacity:.92; margin-bottom:18px; }

        .steps-dots { display:flex; gap:10px; margin-bottom:14px; }
        .steps-dots .dot {
            width: 14px; height: 14px; border-radius:50%;
            background: rgba(255,255,255,0.35);
            transition: background .2s, transform .2s;
        }
        .steps-dots .dot.done { background:#fff; }
        .steps-dots .dot.current { background:#fff; transform: scale(1.4); }

        /* === OPTION GRID === */
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 460px;
            margin-bottom: 22px;
        }
        @media (min-width: 520px) { .options { grid-template-columns: repeat(4, 1fr); max-width: 720px; } }

        .opt {
            background: rgba(255,255,255,0.95);
            color: #1c6b4a;
            border: 4px solid transparent;
            border-radius: 20px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
        }
        .opt:hover { transform: translateY(-5px); }
        .opt.selected { border-color: #f1c40f; box-shadow: 0 0 0 4px rgba(241,196,15,.4), 0 8px 18px rgba(0,0,0,.2); }
        .opt .opt-art { display:block; height: 100px; margin-bottom: 8px; }
        .opt .opt-art img { height: 100%; width: auto; max-width: 100%; object-fit: contain; }
        .opt .opt-emoji { font-size: 3.4rem; line-height:100px; display:block; }
        .opt .opt-name { font-family: 'Fredoka One', cursive; font-size: 1.05rem; }

        .options.number-mode { display:flex; flex-direction:column; align-items:center; gap:18px; }
        .num-picker { display:flex; align-items:center; gap:14px; }
        .num-step {
            font-family: 'Fredoka One', cursive; font-size: 2.2rem; width: 64px; height: 64px;
            border: none; border-radius: 50%; cursor: pointer; color: #11998e; background: #fff;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }
        .num-input {
            font-family: 'Fredoka One', cursive; font-size: 4rem; width: 150px; text-align: center;
            color: #1c6b4a; background: rgba(255,255,255,0.95); border: 4px solid #f1c40f;
            border-radius: 20px; padding: 6px 0; outline: none;
        }
        .num-quick { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
        .num-chip {
            font-family: 'Fredoka One', cursive; font-size: 1.3rem; min-width: 56px; padding: 10px 12px;
            border: 3px solid transparent; border-radius: 14px; cursor: pointer;
            color: #1c6b4a; background: rgba(255,255,255,0.95);
        }
        .num-chip.selected { border-color: #f1c40f; }

        .nav-row { display:flex; gap:14px; align-items:center; }

        /* === COLORING SCREEN === */
        #screen-paint { padding-bottom: 20px; }
        .paint-wrap {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-card {
            background: #fff;
            border-radius: 24px;
            padding: 10px;
            box-shadow: 0 14px 36px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
        }
        .art-stack { display:grid; }
        .art-stack canvas { grid-area: 1 / 1; width: 100%; height: auto; display:block; border-radius: 14px; }
        #traco { cursor: pointer; touch-action: manipulation; }
        .loading { color:#1c6b4a; font-family:'Fredoka One', cursive; text-align:center; padding: 60px 10px; }

        .palette {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px 0 6px;
            max-width: 460px;
        }
        .swatch {
            width: 46px; height: 46px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.8);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform .12s ease, border-color .12s;
            position: relative;
        }
        .swatch:hover { transform: scale(1.12); }
        .swatch.sel { border-color: #f1c40f; transform: scale(1.22); box-shadow: 0 0 0 4px rgba(241,196,15,.45); }
        .swatch.eraser { background:#fff; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }

        .tool-row { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:12px; }

        .hint { text-align:center; font-weight:700; opacity:.95; margin: 4px 0 2px; }

        @media (max-width: 600px) {
            h1.title { font-size: 2rem; }
            .step-head { font-size: 1.55rem; }
            .swatch { width: 40px; height:40px; }
        }
    </style>
</head>
<body>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>

    <!-- TITLE -->
    <section id="screen-title" class="screen active">
        <div class="top-bar"><a href="index.html" class="home-link">🏠 Início</a><span></span></div>
        <span class="mascot">🎨⚽</span>
        <h1 class="title">Pintor de Craques</h1>
        <p class="subtitle">Monte o seu jogador e pinte do seu jeito!</p>

    <!-- WIZARD -->
    <section id="screen-wizard" class="screen">
        <div class="top-bar">
            <a href="index.html" class="home-link">🏠 Início</a>

        </div>

                <button class="btn secondary" id="btn-remake">↺ Montar outro</button>
            </div>
            <p class="hint">Toque numa bolinha de cor e depois pinte o desenho! 🖌️</p>

            <div class="palette" id="palette"></div>
            <div class="tool-row">

<script>
/* ====================== DADOS DAS ESCOLHAS ====================== */
/* Desenhos de linha em img/pintor/: cabeça + corpo já montados por pose
   ({jogador}_{pose}.png), miniaturas (rosto_{jogador}.png) e objetos (obj_{objeto}.png). */
const IMG = 'img/pintor/';
const PLAYERS = [
    { id:'messi',   name:'Messi',         num:'10' },
    { id:'cr7',     name:'Cristiano',     num:'7'  },
    { id:'neymar',  name:'Neymar',        num:'10' },
    { id:'mbappe',  name:'Mbappé',        num:'10' },
    { id:'dibu',    name:'Dibu Martínez', num:'23' },
    { id:'yamal',   name:'Lamine Yamal',  num:'19' },
    { id:'kane',    name:'Harry Kane',    num:'9'  },
    { id:'haaland', name:'Haaland',       num:'9'  },
];
const OBJECTS = [
    { id:'trofeu',  name:'Troféu',  emoji:'🏆' },
    { id:'bola',    name:'Bola',    emoji:'⚽' },
    { id:'medalha', name:'Medalha', emoji:'🥇' },
    { id:'nenhum',  name:'Nada',    emoji:'🙌' },
];
const POSES = [
    { id:'parado',      name:'Em pé',        emoji:'🧍' },
    { id:'chutando',    name:'Chutando',     emoji:'🦵' },
    { id:'comemorando', name:'Comemorando',  emoji:'🙌' },
    { id:'goleiro',     name:'Goleiro',      emoji:'🧤' },
];
const SHIRTS = [
    { id:'lisa',      name:'Lisa',             emoji:'👕' },
    { id:'vertical',  name:'Listras em pé',    emoji:'🎽' },
    { id:'horizontal',name:'Listras deitadas', emoji:'🎽' },
    { id:'faixa',     name:'Faixa',            emoji:'🏳️' },
];

/* tamanho de cada desenho e um ponto dentro da camisa (para achar a área do peito) */
const POSE_META = {
    parado:      { w:419, h:885, seed:[210,350] },
    chutando:    { w:813, h:884, seed:[404,391] },
    comemorando: { w:668, h:884, seed:[334,390] },
    goleiro:     { w:785, h:884, seed:[393,390] },
};

/* miniatura do rosto do jogador para o passo de escolha */
function miniPlayer(p){
    return `<img src="${IMG}rosto_${p.id}.png" alt="" loading="lazy">`;
}

/* ====================== PALETA DE CORES ====================== */
const PALETTE = [
    {n:'Pele clara', c:'#ffe0bd'},
    {n:'Pele média', c:'#e0ac69'},
    {n:'Pele morena',c:'#a0623b'},
    {n:'Pele escura',c:'#6b4226'},
    {n:'Loiro',      c:'#f4d35e'},
    {n:'Castanho',   c:'#8b5a2b'},
    {n:'Preto',      c:'#2b2b2b'},
    {n:'Branco',     c:'#ffffff'},
    {n:'Cinza',      c:'#bdc3c7'},
    {n:'Dourado',    c:'#d4af37'},
    {n:'Vermelho',   c:'#e74c3c'},
    {n:'Laranja',    c:'#e67e22'},
    {n:'Amarelo',    c:'#f1c40f'},
    {n:'Verde',      c:'#27ae60'},
    {n:'Azul claro', c:'#74b9ff'},
    {n:'Azul',       c:'#3498db'},
    {n:'Azul escuro',c:'#2c3e50'},
    {n:'Roxo',       c:'#9b59b6'},
    {n:'Rosa',       c:'#ff6fa5'},
];

/* ====================== ESTADO E FLUXO ====================== */
const STEPS = [
    { key:'player', title:'1. Escolha o craque', sub:'Qual jogador você quer pintar?', list:PLAYERS, kind:'player' },
    { key:'object', title:'2. Escolha um objeto', sub:'O que vai aparecer junto do craque?', list:OBJECTS, kind:'emoji' },
    { key:'pose',   title:'3. Escolha a pose',    sub:'Como ele vai posar?', list:POSES, kind:'emoji' },
    { key:'shirt',  title:'4. Escolha a camisa',  sub:'Qual o estilo da camisa?', list:SHIRTS, kind:'emoji' },
    { key:'number', title:'5. Escolha o número',  sub:'Qual número vai na camisa? (1 a 99)', kind:'number' },
];
const QUICK_NUMBERS = ['1','7','9','10','11','23'];

const cfg = { player:null, object:null, pose:null, shirt:null, number:null };
let stepIndex = 0;
let selectedColor = '#e74c3c';

const $ = id => document.getElementById(id);
function show(screen){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $(screen).classList.add('active');
    window.scrollTo(0,0);
}

function renderDots(){
    $('dots').innerHTML = STEPS.map((_,i)=>{
        const cls = i<stepIndex ? 'done' : (i===stepIndex ? 'current' : '');
        return `<span class="dot ${cls}"></span>`;
    }).join('');
}

function renderStep(){
    const step = STEPS[stepIndex];
    $('step-title').textContent = step.title;
    $('step-sub').textContent = step.sub;
    renderDots();
    if(step.kind==='number'){ renderNumberStep(); return; }
    $('options').classList.remove('number-mode');
    const current = cfg[step.key];
    $('options').innerHTML = step.list.map(o=>{
        const art = step.kind==='player'
            ? `<span class="opt-art">${miniPlayer(o)}</span>`
            : `<span class="opt-emoji">${o.emoji}</span>`;
        const sel = current===o.id ? ' selected' : '';
        return `<div class="opt${sel}" data-id="${o.id}">${art}<span class="opt-name">${o.name}</span></div>`;
    }).join('');
    $('options').querySelectorAll('.opt').forEach(el=>{
        el.addEventListener('click', ()=>{
            cfg[step.key] = el.dataset.id;
            if(step.key==='player') cfg.number = PLAYERS.find(p=>p.id===el.dataset.id).num;
            renderStep();
            updateNext();
        });
    });
    $('btn-back').textContent = stepIndex===0 ? '◂ Voltar' : '◂ Anterior';
    $('btn-next').textContent = stepIndex===STEPS.length-1 ? 'Pintar! 🎨' : 'Próximo ▸';
    updateNext();
}

function validNumber(v){ return /^\d{1,2}$/.test(v||'') && +v>=1 && +v<=99; }

function renderNumberStep(){
    const box = $('options');
    box.classList.add('number-mode');
    const quick = [...new Set([PLAYERS.find(p=>p.id===cfg.player)?.num, ...QUICK_NUMBERS].filter(Boolean))];
    box.innerHTML = `
        <div class="num-picker">
            <button class="num-step" id="num-minus" aria-label="Diminuir">−</button>
            <input id="num-input" class="num-input" type="text" inputmode="numeric" maxlength="2"
                   aria-label="Número da camisa" value="${cfg.number || ''}">
            <button class="num-step" id="num-plus" aria-label="Aumentar">+</button>
        </div>
        <div class="num-quick">${quick.map(n=>
            `<button class="num-chip${cfg.number===n?' selected':''}" data-n="${n}">${n}</button>`).join('')}</div>`;
    const input = $('num-input');
    const set = v => {
        cfg.number = validNumber(v) ? String(+v) : null;
        box.querySelectorAll('.num-chip').forEach(c=>c.classList.toggle('selected', c.dataset.n===cfg.number));
        updateNext();
    };
    input.addEventListener('input', ()=>{
        input.value = input.value.replace(/\D/g,'').slice(0,2);
        set(input.value);
    });
    const bump = d => {
        const n = Math.min(99, Math.max(1, (+cfg.number || 0) + d));
        input.value = n;
        set(String(n));
    };
    $('num-minus').addEventListener('click', ()=>bump(-1));
    $('num-plus').addEventListener('click', ()=>bump(1));
    box.querySelectorAll('.num-chip').forEach(c=>c.addEventListener('click', ()=>{
        input.value = c.dataset.n;
        set(c.dataset.n);
    }));
    $('btn-back').textContent = '◂ Anterior';
    $('btn-next').textContent = 'Pintar! 🎨';
    updateNext();
}

function updateNext(){
    const ready = !!cfg[STEPS[stepIndex].key];
    $('btn-next').disabled = !ready;
    $('btn-next').style.opacity = ready ? '1' : '.5';
}

function goNext(){
    if(!cfg[STEPS[stepIndex].key]) return;
    if(stepIndex < STEPS.length-1){
        stepIndex++;
        renderStep();
    } else {
        startPainting();
    }
}
function goBack(){
    if(stepIndex===0){ show('screen-title'); return; }
    stepIndex--;
    renderStep();
}

/* ====================== PINTURA ====================== */
/* Duas camadas: #cor (as tintas) e, por cima, #traco (só as linhas pretas).
   Tocar numa área enche de cor a região fechada pelas linhas (balde de tinta). */
const LINE_LIMIT = 160;     // abaixo disso (0-255) o pixel é linha
let lineMask = null, colorCtx = null, artW = 0, artH = 0;

function loadImg(src){
    return new Promise((ok, fail)=>{
        const i = new Image();
        i.onload = ()=>ok(i);
        i.onerror = ()=>fail(new Error(src));
        i.src = src;
    });
}

function maskFrom(ctx){
    const d = ctx.getImageData(0, 0, artW, artH).data;
    const m = new Uint8Array(artW*artH);
    for(let i=0, p=0; i<m.length; i++, p+=4) m[i] = d[p] < LINE_LIMIT ? 1 : 0;
    return m;
}

/* região fechada (sem linhas) que contém o ponto i */
function regionAt(mask, start){
    const seen = new Uint8Array(mask.length);
    const out = [];
    if(mask[start]) return { seen, out };
    const stack = [start]; seen[start] = 1;
    while(stack.length){
        const i = stack.pop(); out.push(i);
        const x = i % artW;
        if(x > 0        && !seen[i-1]    && !mask[i-1])    { seen[i-1] = 1;    stack.push(i-1); }
        if(x < artW-1   && !seen[i+1]    && !mask[i+1])    { seen[i+1] = 1;    stack.push(i+1); }
        if(i >= artW    && !seen[i-artW] && !mask[i-artW]) { seen[i-artW] = 1; stack.push(i-artW); }
        if(i < mask.length-artW && !seen[i+artW] && !mask[i+artW]) { seen[i+artW] = 1; stack.push(i+artW); }
    }
    return { seen, out };
}

/* listras, faixa e número desenhados só dentro do peito da camisa */
function drawShirtDetails(ctx, pose){
    const meta = POSE_META[pose];
    const mask = maskFrom(ctx);
    const { seen, out } = regionAt(mask, meta.seed[1]*artW + meta.seed[0]);
    if(!out.length) return;
    let x0=artW, x1=0, y0=artH, y1=0;
    for(const i of out){
        const x = i % artW, y = (i / artW) | 0;
        if(x<x0) x0=x; if(x>x1) x1=x; if(y<y0) y0=y; if(y>y1) y1=y;
    }
    const tw = x1-x0, th = y1-y0;
    const layer = document.createElement('canvas');
    layer.width = artW; layer.height = artH;
    const g = layer.getContext('2d');
    g.strokeStyle = '#222'; g.lineWidth = 5; g.lineCap = 'round';
    const line = (ax,ay,bx,by)=>{ g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke(); };
    if(cfg.shirt==='vertical'){
        const w = tw/7;
        for(const k of [1,3,5]){ line(x0+w*k, y0, x0+w*k, y1); line(x0+w*(k+1), y0, x0+w*(k+1), y1); }
    } else if(cfg.shirt==='horizontal'){
        const h = th/7;
        for(const k of [1,3,5]){ line(x0, y0+h*k, x1, y0+h*k); line(x0, y0+h*(k+1), x1, y0+h*(k+1)); }
    } else if(cfg.shirt==='faixa'){
        const off = tw*0.16;
        line(x0-off, y0, x1-off, y1); line(x0+off, y0, x1+off, y1);
    }
    /* número: apaga o que estiver por baixo e desenha só o contorno */
    const num = cfg.number || '10';
    const size = Math.round(Math.min(tw*0.45, th*0.55));
    g.font = `${size}px 'Fredoka One', 'Arial Black', sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const nx = (x0+x1)/2, ny = y0 + th*0.5;
    g.globalCompositeOperation = 'destination-out';
    g.fillText(num, nx, ny);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#fff'; g.fillText(num, nx, ny);
    g.lineWidth = 4; g.lineJoin = 'round'; g.strokeText(num, nx, ny);
    /* recorta a camada no formato do peito */
    const ld = g.getImageData(0, 0, artW, artH);
    for(let i=0; i<seen.length; i++) if(!seen[i]) ld.data[i*4+3] = 0;
    g.putImageData(ld, 0, 0);
    ctx.drawImage(layer, 0, 0);
}

async function startPainting(){
    const meta = POSE_META[cfg.pose];
    const hasObj = cfg.object && cfg.object !== 'nenhum';
    const slot = hasObj ? Math.round(meta.h*0.34) : 0;
    artW = meta.w + slot; artH = meta.h;

    const holder = $('arte-holder');
    holder.innerHTML = '<p class="loading">Carregando o desenho… ⚽</p>';
    show('screen-paint');

    let body, obj;
    try {
        [body, obj] = await Promise.all([
            loadImg(`${IMG}${cfg.player}_${cfg.pose}.png`),
            hasObj ? loadImg(`${IMG}obj_${cfg.object}.png`) : null,
        ]);
        if(document.fonts) await document.fonts.load(`80px 'Fredoka One'`).catch(()=>{});
    } catch(e) {
        holder.innerHTML = '<p class="loading">Não consegui carregar o desenho 😢</p>';
        return;
    }

    /* camada de linhas: desenho em branco e preto */
    const work = document.createElement('canvas');
    work.width = artW; work.height = artH;
    const w = work.getContext('2d', { willReadFrequently:true });
    w.fillStyle = '#fff'; w.fillRect(0, 0, artW, artH);
    w.drawImage(body, 0, 0);
    if(obj){
        const bw = slot*0.9, bh = artH*0.4;
        const k = Math.min(bw/obj.width, bh/obj.height);
        const ow = obj.width*k, oh = obj.height*k;
        w.drawImage(obj, meta.w + (slot-ow)/2, artH - oh - 24, ow, oh);
    }
    drawShirtDetails(w, cfg.pose);
    lineMask = maskFrom(w);

    /* transforma em linhas pretas sobre fundo transparente */
    const id = w.getImageData(0, 0, artW, artH);
    for(let p=0; p<id.data.length; p+=4){
        const a = 255 - id.data[p];
        id.data[p] = id.data[p+1] = id.data[p+2] = 0;
        id.data[p+3] = a < 18 ? 0 : a;
    }

    holder.innerHTML = `<div class="art-stack">
        <canvas id="cor" width="${artW}" height="${artH}"></canvas>
        <canvas id="traco" width="${artW}" height="${artH}"></canvas></div>`;
    $('traco').getContext('2d').putImageData(id, 0, 0);
    colorCtx = $('cor').getContext('2d', { willReadFrequently:true });
    colorCtx.fillStyle = '#fff'; colorCtx.fillRect(0, 0, artW, artH);
    fitArt();

    $('traco').addEventListener('pointerdown', e=>{
        const r = e.currentTarget.getBoundingClientRect();
        const x = Math.floor((e.clientX - r.left) * artW / r.width);
        const y = Math.floor((e.clientY - r.top) * artH / r.height);
        fillAt(x, y, selectedColor);
    });
    renderPalette();
}

/* tamanho na tela: cabe na largura do cartão e em ~65% da altura da tela */
function fitArt(){
    const card = document.querySelector('.canvas-card');
    const maxH = Math.max(320, window.innerHeight*0.65);
    card.style.maxWidth = Math.round(Math.min(560, maxH*artW/artH)) + 'px';
}

function fillAt(x, y, hex){
    if(!lineMask || x<0 || y<0 || x>=artW || y>=artH) return;
    let start = y*artW + x;
    if(lineMask[start]){
        /* tocou bem na linha: usa o vizinho livre mais próximo */
        let best = -1;
        for(let r=1; r<=8 && best<0; r++)
            for(let dy=-r; dy<=r && best<0; dy++)
                for(let dx=-r; dx<=r; dx++){
                    const xx=x+dx, yy=y+dy;
                    if(xx>=0 && yy>=0 && xx<artW && yy<artH && !lineMask[yy*artW+xx]){ best = yy*artW+xx; break; }
                }
        if(best<0) return;
        start = best;
    }
    const { seen, out } = regionAt(lineMask, start);
    /* avança 2px por baixo das linhas para não sobrar borda branca */
    let edge = out;
    for(let pass=0; pass<2; pass++){
        const next = [];
        for(const i of edge){
            const xx = i % artW;
            const nb = [xx>0 ? i-1 : -1, xx<artW-1 ? i+1 : -1, i-artW, i+artW];
            for(const n of nb){
                if(n>=0 && n<seen.length && !seen[n] && lineMask[n]){ seen[n] = 1; next.push(n); }
            }
        }
        out.push(...next); edge = next;
    }
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const img = colorCtx.getImageData(0, 0, artW, artH);
    const d = img.data;
    for(const i of out){ const p=i*4; d[p]=r; d[p+1]=g; d[p+2]=b; d[p+3]=255; }
    colorCtx.putImageData(img, 0, 0);
}

function renderPalette(){
    const pal = $('palette');
    pal.innerHTML = PALETTE.map(p=>
        `<div class="swatch" data-c="${p.c}" title="${p.n}" style="background:${p.c}"></div>`
    ).join('') + `<div class="swatch eraser" data-c="#ffffff" title="Borracha">🧽</div>`;
    pal.querySelectorAll('.swatch').forEach(s=>{
        s.addEventListener('click', ()=>{
            selectedColor = s.dataset.c;
            pal.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));
            s.classList.add('sel');
        });
    });
    selectedColor = '#e74c3c';
    const def = pal.querySelector('[data-c="#e74c3c"]');
    if(def) def.classList.add('sel');
}

function clearAll(){
    if(!colorCtx) return;
    colorCtx.fillStyle = '#fff'; colorCtx.fillRect(0, 0, artW, artH);
}

function saveImage(){
    if(!colorCtx) return;
    const out = document.createElement('canvas');
    out.width = artW; out.height = artH;
    const ctx = out.getContext('2d');
    ctx.drawImage($('cor'), 0, 0);
    ctx.drawImage($('traco'), 0, 0);
    out.toBlob(blob=>{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'meu-craque.png';
        a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    });
}

/* ====================== LIGAÇÕES ====================== */
$('btn-start').addEventListener('click', ()=>{ stepIndex=0; renderStep(); show('screen-wizard'); });
$('btn-next').addEventListener('click', goNext);
$('btn-back').addEventListener('click', goBack);
window.addEventListener('resize', ()=>{ if(lineMask) fitArt(); });
$('btn-remake').addEventListener('click', ()=>{ stepIndex=0; renderStep(); show('screen-wizard'); });
$('btn-clear').addEventListener('click', clearAll);
$('btn-save').addEventListener('click', saveImage);

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}
