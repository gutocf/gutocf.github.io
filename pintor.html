<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintor de Craques</title>
    <meta name="theme-color" content="#11998e">
    <meta name="description" content="Monte e pinte o seu jogador de futebol!">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        /* === FLOATING BG === */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            pointer-events: none;
            z-index: 0;
        }
        .bg-circle:nth-child(1) { width: 200px; height: 200px; top: -50px; left: -50px; animation: float 8s ease-in-out infinite; }
        .bg-circle:nth-child(2) { width: 150px; height: 150px; bottom: -30px; right: -30px; animation: float 10s ease-in-out infinite reverse; }
        .bg-circle:nth-child(3) { width: 100px; height: 100px; top: 40%; left: 80%; animation: float 7s ease-in-out infinite; }
        .bg-circle:nth-child(4) { width: 180px; height: 180px; top: 60%; left: -40px; animation: float 9s ease-in-out infinite reverse; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            animation: fadeIn 0.5s ease;
        }
        .screen.active { display: flex; }

        .top-bar {
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .home-link {
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            background: rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
        }

        h1.title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.6rem;
            text-align: center;
            margin: 30px 0 6px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.25);
        }
        .subtitle {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 600;
            opacity: 0.95;
            margin-bottom: 26px;
        }

        .mascot {
            font-size: 6rem;
            margin: 10px 0 4px;
            animation: bob 2.2s ease-in-out infinite;
        }
        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

        .btn {
            font-family: 'Fredoka One', cursive;
            border: none;
            border-radius: 18px;
            padding: 16px 34px;
            font-size: 1.3rem;
            cursor: pointer;
            color: #11998e;
            background: #fff;
            box-shadow: 0 10px 24px rgba(0,0,0,0.25);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(0) scale(0.97); }
        .btn.secondary {
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.05rem;
            padding: 12px 22px;
        }

        /* === STEP HEADER === */
        .step-head {
            font-family: 'Fredoka One', cursive;
            font-size: 1.9rem;
            text-align: center;
            margin: 4px 0 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .step-sub { text-align:center; font-weight:600; opacity:.92; margin-bottom:18px; }

        .steps-dots { display:flex; gap:10px; margin-bottom:14px; }
        .steps-dots .dot {
            width: 14px; height: 14px; border-radius:50%;
            background: rgba(255,255,255,0.35);
            transition: background .2s, transform .2s;
        }
        .steps-dots .dot.done { background:#fff; }
        .steps-dots .dot.current { background:#fff; transform: scale(1.4); }

        /* === OPTION GRID === */
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 460px;
            margin-bottom: 22px;
        }
        @media (min-width: 520px) { .options { grid-template-columns: repeat(4, 1fr); max-width: 720px; } }

        .opt {
            background: rgba(255,255,255,0.95);
            color: #1c6b4a;
            border: 4px solid transparent;
            border-radius: 20px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
        }
        .opt:hover { transform: translateY(-5px); }
        .opt.selected { border-color: #f1c40f; box-shadow: 0 0 0 4px rgba(241,196,15,.4), 0 8px 18px rgba(0,0,0,.2); }
        .opt .opt-art { display:block; height: 100px; margin-bottom: 8px; }
        .opt .opt-art svg { height: 100%; width: 100%; }
        .opt .opt-emoji { font-size: 3.4rem; line-height:100px; display:block; }
        .opt .opt-name { font-family: 'Fredoka One', cursive; font-size: 1.05rem; }

        .nav-row { display:flex; gap:14px; align-items:center; }

        /* === COLORING SCREEN === */
        #screen-paint { padding-bottom: 20px; }
        .paint-wrap {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-card {
            background: #fff;
            border-radius: 24px;
            padding: 10px;
            box-shadow: 0 14px 36px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
        }
        #arte { width: 100%; height: auto; display:block; touch-action: manipulation; }
        #arte .regiao { cursor: pointer; transition: fill .08s; }

        .palette {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px 0 6px;
            max-width: 460px;
        }
        .swatch {
            width: 46px; height: 46px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.8);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: transform .12s ease, border-color .12s;
            position: relative;
        }
        .swatch:hover { transform: scale(1.12); }
        .swatch.sel { border-color: #f1c40f; transform: scale(1.22); box-shadow: 0 0 0 4px rgba(241,196,15,.45); }
        .swatch.eraser { background:#fff; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }

        .tool-row { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:12px; }

        .hint { text-align:center; font-weight:700; opacity:.95; margin: 4px 0 2px; }

        @media (max-width: 600px) {
            h1.title { font-size: 2rem; }
            .step-head { font-size: 1.55rem; }
            .swatch { width: 40px; height:40px; }
        }
    </style>
</head>
<body>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>

    <!-- TITLE -->
    <section id="screen-title" class="screen active">
        <div class="top-bar"><a href="index.html" class="home-link">🏠 Início</a><span></span></div>
        <span class="mascot">🎨⚽</span>
        <h1 class="title">Pintor de Craques</h1>
        <p class="subtitle">Monte o seu jogador e pinte do seu jeito!</p>
        <button class="btn" id="btn-start">Começar a pintar ▸</button>
    </section>

    <!-- WIZARD -->
    <section id="screen-wizard" class="screen">
        <div class="top-bar">
            <a href="index.html" class="home-link">🏠 Início</a>
            <div class="steps-dots" id="dots"></div>
            <span style="width:64px"></span>
        </div>
        <h2 class="step-head" id="step-title"></h2>
        <p class="step-sub" id="step-sub"></p>
        <div class="options" id="options"></div>
        <div class="nav-row">
            <button class="btn secondary" id="btn-back">◂ Voltar</button>
            <button class="btn" id="btn-next" disabled style="opacity:.5">Próximo ▸</button>
        </div>
    </section>

    <!-- PAINT -->
    <section id="screen-paint" class="screen">
        <div class="paint-wrap">
            <div class="top-bar">
                <a href="index.html" class="home-link">🏠 Início</a>
                <button class="btn secondary" id="btn-remake">↺ Montar outro</button>
            </div>
            <p class="hint">Toque numa bolinha de cor e depois pinte o desenho! 🖌️</p>
            <div class="canvas-card">
                <div id="arte-holder"></div>
            </div>
            <div class="palette" id="palette"></div>
            <div class="tool-row">
                <button class="btn secondary" id="btn-clear">🧹 Limpar tudo</button>
                <button class="btn secondary" id="btn-save">💾 Salvar imagem</button>
            </div>
        </div>
    </section>

<script>
/* ====================== DADOS DAS ESCOLHAS ====================== */
/* Jogadores: desenhos ORIGINAIS, reconhecíveis por cabelo/barba/número.
   Não são cópias de fotos — são ilustrações de linha feitas para colorir. */
const PLAYERS = [
    { id:'messi',  name:'Messi',     hair:'messi',  beard:true,  num:'10' },
    { id:'cr7',    name:'Cristiano', hair:'cr7',    beard:false, num:'7'  },
    { id:'neymar', name:'Neymar',    hair:'neymar', beard:false, num:'10' },
    { id:'mbappe', name:'Mbappé',    hair:'mbappe', beard:false, num:'10' },
];
const OBJECTS = [
    { id:'trofeu',   name:'Troféu',  emoji:'🏆' },
    { id:'bola',     name:'Bola',    emoji:'⚽' },
    { id:'medalha',  name:'Medalha', emoji:'🥇' },
    { id:'luva',     name:'Luvas',   emoji:'🧤' },
];
const POSES = [
    { id:'parado',      name:'Em pé',        emoji:'🧍' },
    { id:'chutando',    name:'Chutando',     emoji:'🦵' },
    { id:'comemorando', name:'Comemorando',  emoji:'🙌' },
    { id:'goleiro',     name:'Goleiro',      emoji:'🥅' },
];
const SHIRTS = [
    { id:'lisa',      name:'Lisa',             emoji:'👕' },
    { id:'vertical',  name:'Listras em pé',    emoji:'🎽' },
    { id:'horizontal',name:'Listras deitadas', emoji:'🎽' },
    { id:'faixa',     name:'Faixa',            emoji:'🏳️' },
];

const POSE_ANGLES = {
    parado:      { armL:8,    armR:-8,   legL:4,   legR:-4  },
    chutando:    { armL:26,   armR:-20,  legL:6,   legR:-55 },
    comemorando: { armL:148,  armR:-148, legL:4,   legR:-4  },
    goleiro:     { armL:76,   armR:-76,  legL:20,  legR:-20 },
};

/* ====================== CONSTRUÇÃO DO SVG ====================== */
function reg(cor, d){ return `<path class="regiao" data-cor="${cor}" d="${d}"/>`; }
function regC(cor, cx, cy, r){ return `<circle class="regiao" data-cor="${cor}" cx="${cx}" cy="${cy}" r="${r}"/>`; }
function regE(cor, cx, cy, rx, ry){ return `<ellipse class="regiao" data-cor="${cor}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`; }

/* --- cabeça, cabelo, barba e rosto (reaproveitado no preview) --- */
function hairPath(id){
    switch(id){
        case 'cr7': /* curto e arrumado */
            return 'M167,86 C165,52 186,44 200,44 C214,44 235,52 233,86 C229,70 221,62 211,60 C207,53 193,53 189,60 C179,62 171,70 167,86 Z';
        case 'neymar': /* topete / laterais raspadas */
            return 'M180,80 C178,50 191,40 200,40 C209,40 222,50 220,80 C217,64 213,58 207,56 C205,48 195,48 193,56 C187,58 183,64 180,80 Z';
        case 'mbappe': /* bem curto, colado */
            return 'M170,80 C170,54 188,46 200,46 C212,46 230,54 230,80 C226,68 218,62 210,61 C206,56 194,56 190,61 C182,62 174,68 170,80 Z';
        default: /* messi: cheio, com volume */
            return 'M165,90 C161,52 184,42 200,42 C216,42 239,52 235,90 C232,74 224,64 215,62 C209,52 191,52 185,62 C176,64 168,74 165,90 Z';
    }
}
function beardPath(){
    return 'M172,112 C176,138 190,150 200,150 C210,150 224,138 228,112 '
         + 'C224,124 214,130 200,130 C186,130 176,124 172,112 Z';
}
function faceFeatures(){
    /* traços finos do rosto (não são áreas de pintar) */
    return `<g fill="none" stroke="#2b2b2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M178,90 Q187,85 196,90"/>
        <path d="M204,90 Q213,85 222,90"/>
        <path d="M180,99 Q188,94 196,99 Q188,103 180,99 Z"/>
        <path d="M204,99 Q212,94 220,99 Q212,103 204,99 Z"/>
        <path d="M200,100 L196,114 Q200,117 205,114"/>
        <path d="M188,126 Q200,133 212,126"/>
      </g>
      <circle cx="188" cy="99" r="2.4" fill="#2b2b2b"/>
      <circle cx="212" cy="99" r="2.4" fill="#2b2b2b"/>`;
}
function headGroup(p){
    const face = reg('pele', 'M168,72 C168,48 188,40 200,40 C212,40 232,48 232,72 '
        + 'C232,94 230,108 222,120 C215,132 207,140 200,140 C193,140 185,132 178,120 '
        + 'C170,108 168,94 168,72 Z');
    const earL = reg('pele', 'M168,92 C160,90 158,104 166,108 C170,109 172,106 172,102 Z');
    const earR = reg('pele', 'M232,92 C240,90 242,104 234,108 C230,109 228,106 228,102 Z');
    const hair = reg('cabelo', hairPath(p.hair));
    const beard = p.beard ? reg('cabelo', beardPath()) : '';
    return face + earL + earR + hair + beard + faceFeatures();
}

/* --- braços e pernas (rotacionados conforme a pose) --- */
function armGroup(px, py, angle, glove){
    const hand = glove
        ? reg('luva', `M${px-13},${py+150} C${px-18},${py+166} ${px-9},${py+180} ${px},${py+180} `
                    + `C${px+9},${py+180} ${px+18},${py+166} ${px+13},${py+150} Z`)
          + reg('luva', `M${px-13},${py+150} L${px+13},${py+150} L${px+12},${py+158} L${px-12},${py+158} Z`)
        : reg('pele', `M${px-12},${py+150} C${px-16},${py+164} ${px-8},${py+176} ${px},${py+176} `
                    + `C${px+8},${py+176} ${px+16},${py+164} ${px+12},${py+150} Z`);
    return `<g transform="rotate(${angle} ${px} ${py})">`
        + reg('pele', `M${px-12},${py} C${px-13},${py} ${px-14},${py+4} ${px-14},${py+9} `
            + `L${px-11},${py+150} C${px-11},${py+157} ${px+11},${py+157} ${px+11},${py+150} `
            + `L${px+14},${py+9} C${px+14},${py+4} ${px+13},${py} ${px+12},${py} Z`)
        + hand
        + '</g>';
}
function legGroup(px, py, angle){
    const sb = py+200;   // topo da meia
    const bt = sb+54;    // topo da chuteira
    return `<g transform="rotate(${angle} ${px} ${py})">`
        + reg('pele', `M${px-13},${py} C${px-14},${py} ${px-15},${py+6} ${px-15},${py+12} `
            + `L${px-12},${sb} L${px+12},${sb} L${px+15},${py+12} `
            + `C${px+15},${py+6} ${px+14},${py} ${px+13},${py} Z`)
        + reg('meia', `M${px-12},${sb} L${px+12},${sb} L${px+13},${bt} L${px-13},${bt} Z`)
        + reg('chuteira', `M${px-13},${bt} C${px-16},${bt+16} ${px-6},${bt+24} ${px},${bt+24} `
            + `L${px+36},${bt+24} C${px+42},${bt+24} ${px+42},${bt+12} ${px+35},${bt+6} L${px+13},${bt} Z`)
        + '</g>';
}

/* --- padrões da camisa (recortados no torso) --- */
function shirtPattern(id){
    if(id==='vertical'){
        return reg('listra','M176,176 L188,176 L188,360 L176,360 Z')
             + reg('listra','M196,176 L208,176 L208,360 L196,360 Z')
             + reg('listra','M216,176 L228,176 L228,360 L216,360 Z');
    }
    if(id==='horizontal'){
        return reg('listra','M150,206 L250,206 L250,228 L150,228 Z')
             + reg('listra','M150,254 L250,254 L250,276 L150,276 Z')
             + reg('listra','M150,302 L250,302 L250,324 L150,324 Z');
    }
    if(id==='faixa'){
        return reg('faixa','M120,260 L210,160 L262,196 L172,320 Z');
    }
    return '';
}

/* --- objetos --- */
function objectSVG(id){
    const tcx = 298;
    switch(id){
        case 'trofeu':
            return regE('dourado', tcx, 312, 42, 9)
                 + reg('dourado', `M${tcx-40},312 C${tcx-40},356 ${tcx-22},374 ${tcx},374 C${tcx+22},374 ${tcx+40},356 ${tcx+40},312 Z`)
                 + reg('dourado', `M${tcx-38},318 C${tcx-66},316 ${tcx-66},354 ${tcx-44},358 L${tcx-43},349 C${tcx-58},346 ${tcx-57},325 ${tcx-38},327 Z`)
                 + reg('dourado', `M${tcx+38},318 C${tcx+66},316 ${tcx+66},354 ${tcx+44},358 L${tcx+43},349 C${tcx+58},346 ${tcx+57},325 ${tcx+38},327 Z`)
                 + reg('dourado', `M${tcx-7},374 L${tcx+7},374 L${tcx+6},392 L${tcx-6},392 Z`)
                 + regE('dourado', tcx, 396, 14, 7)
                 + reg('dourado', `M${tcx-30},401 L${tcx+30},401 L${tcx+30},408 L${tcx-30},408 Z`)
                 + reg('castanho', `M${tcx-26},408 L${tcx+26},408 L${tcx+30},436 C${tcx+30},442 ${tcx+25},444 ${tcx+19},444 L${tcx-19},444 C${tcx-25},444 ${tcx-30},442 ${tcx-30},436 Z`);
        case 'bola':
            return regC('branco', 200, 706, 36)
                 + reg('preto', 'M200,684 L214,694 L208,710 L192,710 L186,694 Z')
                 + reg('preto', 'M168,698 L180,694 L186,706 L176,714 Z')
                 + reg('preto', 'M232,698 L220,694 L214,706 L224,714 Z')
                 + reg('preto', 'M196,730 L204,730 L208,740 L192,740 Z');
        case 'medalha':
            return reg('fita', 'M186,150 L196,150 L207,222 L197,222 Z')
                 + reg('fita', 'M214,150 L204,150 L193,222 L203,222 Z')
                 + regC('dourado', 200, 246, 27)
                 + reg('estrela', 'M200,231 L204,242 L216,242 L206,249 L210,260 L200,253 L190,260 L194,249 L184,242 L196,242 Z');
        default: return ''; // luva é desenhada nas mãos
    }
}

function buildSVG(cfg){
    const p = PLAYERS.find(x=>x.id===cfg.player) || PLAYERS[0];
    const A = POSE_ANGLES[cfg.pose];
    const glove = cfg.object === 'luva';

    const legL = legGroup(186, 422, A.legL);
    const legR = legGroup(214, 422, A.legR);
    const armL = armGroup(160, 196, A.armL, glove);
    const armR = armGroup(240, 196, A.armR, glove);

    const shorts = reg('calcao', 'M168,358 L232,358 L240,432 L210,432 L200,394 L190,432 L160,432 Z');
    const neck   = reg('pele', 'M190,134 L210,134 L213,174 L187,174 Z');
    const torsoD = 'M158,176 C150,176 150,182 150,188 L150,212 C150,216 148,218 146,220 L160,240 '
                 + 'C162,236 164,234 166,234 L168,352 C168,358 172,361 178,361 L222,361 '
                 + 'C228,361 232,358 232,352 L234,234 C236,234 238,236 240,240 L254,220 '
                 + 'C252,218 250,216 250,212 L250,188 C250,182 250,176 242,176 '
                 + 'C234,176 230,180 222,182 L214,184 C208,186 192,186 186,184 L178,182 '
                 + 'C170,180 166,176 158,176 Z';
    const torso  = reg('camisa', torsoD);
    const collar = reg('camisa', 'M186,184 L200,198 L214,184 L209,176 L200,186 L191,176 Z');
    const pattern = `<g clip-path="url(#torsoClip)">${shirtPattern(cfg.shirt)}</g>`;
    const numero = `<text x="200" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" `
                 + `font-size="48" font-weight="bold" fill="none" stroke="#2b2b2b" stroke-width="1.6">${p.num}</text>`;
    const sleeveSeams = `<g fill="none" stroke="#222" stroke-width="2">`
                 + `<path d="M166,234 L160,240"/><path d="M234,234 L240,240"/></g>`;

    return `
      <svg id="arte" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 770">
        <defs>
          <clipPath id="torsoClip"><path d="${torsoD}"/></clipPath>
        </defs>
        <style>
          #arte .regiao{ fill:#ffffff; stroke:#222; stroke-width:2.6; stroke-linejoin:round; }
        </style>
        ${legL}${legR}
        ${shorts}
        ${neck}
        ${torso}${collar}${pattern}${sleeveSeams}${numero}
        ${armL}${armR}
        ${headGroup(p)}
        ${objectSVG(cfg.object)}
      </svg>`;
}

/* miniatura do rosto do jogador para o passo de escolha */
function miniPlayer(p){
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <style>
          .mp-pele{ fill:#ffe0bd; stroke:#222; stroke-width:3; }
          .mp-cab{ fill:#5a3a22; stroke:#222; stroke-width:3; }
        </style>
        <g transform="translate(-100,-22) scale(1.6)">
          <path class="mp-pele" d="M168,72 C168,48 188,40 200,40 C212,40 232,48 232,72 C232,94 230,108 222,120 C215,132 207,140 200,140 C193,140 185,132 178,120 C170,108 168,94 168,72 Z"/>
          <path class="mp-cab" d="${hairPath(p.hair)}"/>
          ${p.beard ? `<path class="mp-cab" d="${beardPath()}"/>` : ''}
          ${faceFeatures()}
        </g>
    </svg>`;
}

/* ====================== PALETA DE CORES ====================== */
const PALETTE = [
    {n:'Pele clara', c:'#ffe0bd'},
    {n:'Pele média', c:'#e0ac69'},
    {n:'Pele morena',c:'#a0623b'},
    {n:'Pele escura',c:'#6b4226'},
    {n:'Loiro',      c:'#f4d35e'},
    {n:'Castanho',   c:'#8b5a2b'},
    {n:'Preto',      c:'#2b2b2b'},
    {n:'Branco',     c:'#ffffff'},
    {n:'Cinza',      c:'#bdc3c7'},
    {n:'Dourado',    c:'#d4af37'},
    {n:'Vermelho',   c:'#e74c3c'},
    {n:'Laranja',    c:'#e67e22'},
    {n:'Amarelo',    c:'#f1c40f'},
    {n:'Verde',      c:'#27ae60'},
    {n:'Azul claro', c:'#74b9ff'},
    {n:'Azul',       c:'#3498db'},
    {n:'Azul escuro',c:'#2c3e50'},
    {n:'Roxo',       c:'#9b59b6'},
    {n:'Rosa',       c:'#ff6fa5'},
];

/* ====================== ESTADO E FLUXO ====================== */
const STEPS = [
    { key:'player', title:'1. Escolha o craque', sub:'Qual jogador você quer pintar?', list:PLAYERS, kind:'player' },
    { key:'object', title:'2. Escolha um objeto', sub:'O que o craque vai segurar?', list:OBJECTS, kind:'emoji' },
    { key:'pose',   title:'3. Escolha a pose',    sub:'Como ele vai posar?', list:POSES, kind:'emoji' },
    { key:'shirt',  title:'4. Escolha a camisa',  sub:'Pronto pra pintar depois!', list:SHIRTS, kind:'emoji' },
];

const cfg = { player:null, object:null, pose:null, shirt:null };
let stepIndex = 0;
let selectedColor = '#e74c3c';

const $ = id => document.getElementById(id);
function show(screen){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $(screen).classList.add('active');
    window.scrollTo(0,0);
}

function renderDots(){
    $('dots').innerHTML = STEPS.map((_,i)=>{
        const cls = i<stepIndex ? 'done' : (i===stepIndex ? 'current' : '');
        return `<span class="dot ${cls}"></span>`;
    }).join('');
}

function renderStep(){
    const step = STEPS[stepIndex];
    $('step-title').textContent = step.title;
    $('step-sub').textContent = step.sub;
    renderDots();
    const current = cfg[step.key];
    $('options').innerHTML = step.list.map(o=>{
        const art = step.kind==='player'
            ? `<span class="opt-art">${miniPlayer(o)}</span>`
            : `<span class="opt-emoji">${o.emoji}</span>`;
        const sel = current===o.id ? ' selected' : '';
        return `<div class="opt${sel}" data-id="${o.id}">${art}<span class="opt-name">${o.name}</span></div>`;
    }).join('');
    $('options').querySelectorAll('.opt').forEach(el=>{
        el.addEventListener('click', ()=>{
            cfg[step.key] = el.dataset.id;
            renderStep();
            updateNext();
        });
    });
    $('btn-back').textContent = stepIndex===0 ? '◂ Voltar' : '◂ Anterior';
    $('btn-next').textContent = stepIndex===STEPS.length-1 ? 'Pintar! 🎨' : 'Próximo ▸';
    updateNext();
}

function updateNext(){
    const ready = !!cfg[STEPS[stepIndex].key];
    $('btn-next').disabled = !ready;
    $('btn-next').style.opacity = ready ? '1' : '.5';
}

function goNext(){
    if(!cfg[STEPS[stepIndex].key]) return;
    if(stepIndex < STEPS.length-1){
        stepIndex++;
        renderStep();
    } else {
        startPainting();
    }
}
function goBack(){
    if(stepIndex===0){ show('screen-title'); return; }
    stepIndex--;
    renderStep();
}

/* ====================== PINTURA ====================== */
function startPainting(){
    $('arte-holder').innerHTML = buildSVG(cfg);
    const svg = $('arte');
    svg.addEventListener('pointerdown', e=>{
        const t = e.target;
        if(t.classList && t.classList.contains('regiao')){
            t.style.fill = selectedColor;
        }
    });
    renderPalette();
    show('screen-paint');
}

function renderPalette(){
    const pal = $('palette');
    pal.innerHTML = PALETTE.map(p=>
        `<div class="swatch" data-c="${p.c}" title="${p.n}" style="background:${p.c}"></div>`
    ).join('') + `<div class="swatch eraser" data-c="#ffffff" title="Borracha">🧽</div>`;
    pal.querySelectorAll('.swatch').forEach(s=>{
        s.addEventListener('click', ()=>{
            selectedColor = s.dataset.c;
            pal.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));
            s.classList.add('sel');
        });
    });
    selectedColor = '#e74c3c';
    const def = pal.querySelector('[data-c="#e74c3c"]');
    if(def) def.classList.add('sel');
}

function clearAll(){
    $('arte').querySelectorAll('.regiao').forEach(r=>{ r.style.fill = '#ffffff'; });
}

function saveImage(){
    const svg = $('arte');
    const data = new XMLSerializer().serializeToString(svg);
    const img = new Image();
    const svgBlob = new Blob([data], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    img.onload = ()=>{
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = 400*scale;
        canvas.height = 770*scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob=>{
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'meu-craque.png';
            a.click();
            setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
        });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); alert('Não consegui salvar a imagem 😢'); };
    img.src = url;
}

/* ====================== LIGAÇÕES ====================== */
$('btn-start').addEventListener('click', ()=>{ stepIndex=0; renderStep(); show('screen-wizard'); });
$('btn-next').addEventListener('click', goNext);
$('btn-back').addEventListener('click', goBack);
$('btn-remake').addEventListener('click', ()=>{ stepIndex=0; renderStep(); show('screen-wizard'); });
$('btn-clear').addEventListener('click', clearAll);
$('btn-save').addEventListener('click', saveImage);

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}
</script>
